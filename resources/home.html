<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>起始页</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #f4f6fb;
        background: #0e1016;
      }
      .wrap { text-align: center; padding: 32px 24px; max-width: 420px; }
      .orb {
        width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
        display: grid; place-items: center; color: #8d95a6;
        background: radial-gradient(circle at 50% 40%, #242833, #16181f 70%);
      }
      .orb svg { width: 30px; height: 30px; }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 680; }
      p { margin: 0 auto 18px; color: #a8b0c0; font-size: 13.5px; line-height: 1.6; }
      .sites { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      a.site {
        height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
        background: #1b1e27; color: inherit; text-decoration: none;
        display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px;
      }
      a.site:hover { background: #262b38; }
      i { width: 8px; height: 8px; border-radius: 50%; display: block; flex: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="orb" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          <path d="m8.2 10.2 3.8 3.8 3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 18.5h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </div>
      <h1>还没有下载任务</h1>
      <p>打开视频或音频页面，点右上角「下载此页」。</p>
      <nav class="sites">
        <a class="site" href="https://www.bilibili.com"><i style="background:#fb7299"></i>Bilibili</a>
        <a class="site" href="https://www.douyin.com"><i style="background:#161823"></i>抖音</a>
        <a class="site" href="https://www.youtube.com"><i style="background:#ff4d4d"></i>YouTube</a>
        <a class="site" href="https://www.xiaohongshu.com"><i style="background:#ff2442"></i>小红书</a>
      </nav>
    </div>
  </body>
</html>
